<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retention - Your Mental Gym</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide Icons as simple SVG components
        const Calendar = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        );

        const BookOpen = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        );

        const Youtube = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/>
            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>
          </svg>
        );

        const Trophy = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
          </svg>
        );

        const Flame = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
        );

        const Target = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="6"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
        );

        // Main App Component
        const RetentionApp = () => {
          const [view, setView] = useState('home');
          const [books, setBooks] = useState([]);
          const [youtubeVideos, setYoutubeVideos] = useState([]);
          const [currentQuiz, setCurrentQuiz] = useState(null);
          const [streak, setStreak] = useState(0);
          const [lastQuizDate, setLastQuizDate] = useState(null);
          const [score, setScore] = useState(0);
          const [quizHistory, setQuizHistory] = useState([]);

          // Load data from localStorage
          useEffect(() => {
            const savedBooks = localStorage.getItem('retentionBooks');
            const savedVideos = localStorage.getItem('retentionVideos');
            const savedStreak = localStorage.getItem('streak');
            const savedLastQuiz = localStorage.getItem('lastQuizDate');
            const savedScore = localStorage.getItem('totalScore');
            const savedHistory = localStorage.getItem('quizHistory');

            if (savedBooks) setBooks(JSON.parse(savedBooks));
            if (savedVideos) setYoutubeVideos(JSON.parse(savedVideos));
            if (savedStreak) setStreak(parseInt(savedStreak));
            if (savedLastQuiz) setLastQuizDate(savedLastQuiz);
            if (savedScore) setScore(parseInt(savedScore));
            if (savedHistory) setQuizHistory(JSON.parse(savedHistory));
          }, []);

          // Save to localStorage
          useEffect(() => { localStorage.setItem('retentionBooks', JSON.stringify(books)); }, [books]);
          useEffect(() => { localStorage.setItem('retentionVideos', JSON.stringify(youtubeVideos)); }, [youtubeVideos]);
          useEffect(() => { localStorage.setItem('streak', streak.toString()); }, [streak]);
          useEffect(() => { if (lastQuizDate) localStorage.setItem('lastQuizDate', lastQuizDate); }, [lastQuizDate]);
          useEffect(() => { localStorage.setItem('totalScore', score.toString()); }, [score]);
          useEffect(() => { localStorage.setItem('quizHistory', JSON.stringify(quizHistory)); }, [quizHistory]);

          // Generate quiz (with fallback questions for demo)
          const generateQuiz = async (content) => {
            // For demo purposes, return sample questions
            // In production, this would call Claude API
            const sampleQuestions = [
              {
                question: `What was the main concept you learned from "${content.title}"?`,
                options: [
                  "A specific fact or statistic",
                  "A broader framework or mental model",
                  "A personal story or example",
                  "A call to action or recommendation"
                ],
                correct: 1,
                explanation: "Retention works best when you focus on frameworks over facts."
              },
              {
                question: `How does the content in "${content.title}" connect to something you already knew?`,
                options: [
                  "It challenged my existing beliefs",
                  "It reinforced what I already thought",
                  "It introduced a completely new concept",
                  "It provided a different perspective"
                ],
                correct: 3,
                explanation: "Making connections strengthens retention."
              },
              {
                question: `What's one practical application from "${content.title}"?`,
                options: [
                  "Something I could try this week",
                  "A long-term habit to build",
                  "A conversation topic to explore",
                  "All of the above"
                ],
                correct: 3,
                explanation: "The best learning is actionable."
              },
              {
                question: `If you had to explain "${content.title}" to a friend in one sentence, what would you say?`,
                options: [
                  "Focus on the most interesting detail",
                  "Share the core insight or thesis",
                  "Describe the author's background",
                  "List the main topics covered"
                ],
                correct: 1,
                explanation: "Being able to synthesize shows true understanding."
              },
              {
                question: `What's one question you still have after consuming "${content.title}"?`,
                options: [
                  "A clarification on a specific point",
                  "How this applies in a different context",
                  "What the research or evidence says",
                  "Where to learn more about this topic"
                ],
                correct: 1,
                explanation: "Good content sparks curiosity and further questions."
              }
            ];

            return {
              ...content,
              questions: sampleQuestions,
              currentQuestion: 0,
              correctAnswers: 0,
              userAnswers: []
            };
          };

          const startDailyQuiz = async () => {
            const allContent = [
              ...books.map(b => ({ ...b, type: 'book' })),
              ...youtubeVideos.map(v => ({ ...v, type: 'youtube' }))
            ];

            if (allContent.length === 0) {
              alert('Add some books or YouTube videos first!');
              return;
            }

            const randomContent = allContent[Math.floor(Math.random() * allContent.length)];
            const quiz = await generateQuiz(randomContent);
            setCurrentQuiz(quiz);
            setView('quiz');
          };

          const submitAnswer = (answerIndex) => {
            const isCorrect = answerIndex === currentQuiz.questions[currentQuiz.currentQuestion].correct;
            
            const updatedQuiz = {
              ...currentQuiz,
              userAnswers: [...currentQuiz.userAnswers, answerIndex],
              correctAnswers: currentQuiz.correctAnswers + (isCorrect ? 1 : 0)
            };

            if (currentQuiz.currentQuestion < currentQuiz.questions.length - 1) {
              updatedQuiz.currentQuestion = currentQuiz.currentQuestion + 1;
              setCurrentQuiz(updatedQuiz);
            } else {
              completeQuiz(updatedQuiz);
            }
          };

          const completeQuiz = (quiz) => {
            const percentCorrect = Math.round((quiz.correctAnswers / quiz.questions.length) * 100);
            const pointsEarned = quiz.correctAnswers * 10;

            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            
            let newStreak = streak;
            if (lastQuizDate === yesterday || !lastQuizDate) {
              newStreak = streak + 1;
            } else if (lastQuizDate !== today) {
              newStreak = 1;
            }

            setStreak(newStreak);
            setLastQuizDate(today);
            setScore(score + pointsEarned);

            const historyEntry = {
              date: today,
              title: quiz.title,
              type: quiz.type,
              score: percentCorrect,
              correct: quiz.correctAnswers,
              total: quiz.questions.length
            };
            setQuizHistory([historyEntry, ...quizHistory.slice(0, 29)]);
            setCurrentQuiz({ ...quiz, completed: true, percentCorrect, pointsEarned });
          };

          const addBook = (bookData) => {
            setBooks([...books, { ...bookData, id: Date.now(), dateAdded: new Date().toISOString() }]);
          };

          const addYouTubeVideo = (videoData) => {
            setYoutubeVideos([...youtubeVideos, { ...videoData, id: Date.now(), dateAdded: new Date().toISOString() }]);
          };

          // Home View
          const HomeView = () => (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 p-6">
              <div className="max-w-2xl mx-auto">
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-bold text-gray-800 mb-2">Retention</h1>
                  <p className="text-gray-600">Your mental gym for what you consume</p>
                </div>

                <div className="grid grid-cols-3 gap-4 mb-8">
                  <div className="bg-white rounded-xl p-4 shadow-sm">
                    <div className="flex items-center justify-between mb-2">
                      <Flame className="text-orange-500" size={24} />
                      <span className="text-2xl font-bold text-gray-800">{streak}</span>
                    </div>
                    <p className="text-sm text-gray-600">Day Streak</p>
                  </div>
                  
                  <div className="bg-white rounded-xl p-4 shadow-sm">
                    <div className="flex items-center justify-between mb-2">
                      <Trophy className="text-yellow-500" size={24} />
                      <span className="text-2xl font-bold text-gray-800">{score}</span>
                    </div>
                    <p className="text-sm text-gray-600">Total Points</p>
                  </div>
                  
                  <div className="bg-white rounded-xl p-4 shadow-sm">
                    <div className="flex items-center justify-between mb-2">
                      <Target className="text-green-500" size={24} />
                      <span className="text-2xl font-bold text-gray-800">{quizHistory.length}</span>
                    </div>
                    <p className="text-sm text-gray-600">Quizzes Done</p>
                  </div>
                </div>

                <button
                  onClick={startDailyQuiz}
                  className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl p-6 mb-6 shadow-lg hover:shadow-xl transition-all"
                >
                  <div className="flex items-center justify-center gap-3">
                    <Calendar size={28} />
                    <div className="text-left">
                      <p className="text-xl font-bold">Start Today's Quiz</p>
                      <p className="text-sm text-indigo-100">5 questions • ~3 minutes</p>
                    </div>
                  </div>
                </button>

                <div className="grid grid-cols-2 gap-4 mb-6">
                  <div className="bg-white rounded-xl p-4 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                      <BookOpen className="text-indigo-600" size={20} />
                      <p className="font-semibold text-gray-800">Books</p>
                    </div>
                    <p className="text-2xl font-bold text-gray-800">{books.length}</p>
                    <p className="text-sm text-gray-600">in your library</p>
                  </div>
                  
                  <div className="bg-white rounded-xl p-4 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                      <Youtube className="text-red-600" size={20} />
                      <p className="font-semibold text-gray-800">Videos</p>
                    </div>
                    <p className="text-2xl font-bold text-gray-800">{youtubeVideos.length}</p>
                    <p className="text-sm text-gray-600">watched recently</p>
                  </div>
                </div>

                <div className="space-y-3">
                  <button
                    onClick={() => setView('addContent')}
                    className="w-full bg-white text-gray-800 rounded-xl p-4 shadow-sm hover:shadow-md transition-all font-semibold"
                  >
                    + Add Content to Track
                  </button>
                  
                  <button
                    onClick={() => setView('stats')}
                    className="w-full bg-white text-gray-800 rounded-xl p-4 shadow-sm hover:shadow-md transition-all font-semibold"
                  >
                    View Progress & History
                  </button>
                </div>
              </div>
            </div>
          );

          // Add Content View
          const AddContentView = () => {
            const [contentType, setContentType] = useState('book');
            const [bookTitle, setBookTitle] = useState('');
            const [bookChapter, setBookChapter] = useState('');
            const [youtubeUrl, setYoutubeUrl] = useState('');

            const handleAddBook = () => {
              if (bookTitle && bookChapter) {
                addBook({ title: bookTitle, chapter: bookChapter });
                setBookTitle('');
                setBookChapter('');
                alert('Book added! Come back after reading and take a quiz.');
              }
            };

            const handleAddYouTube = () => {
              if (youtubeUrl) {
                const videoId = youtubeUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/)?.[1];
                if (videoId) {
                  addYouTubeVideo({
                    title: `YouTube Video`,
                    videoId: videoId,
                    url: youtubeUrl,
                    description: 'Video from YouTube'
                  });
                  setYoutubeUrl('');
                  alert('Video added! Come back after watching and take a quiz.');
                } else {
                  alert('Invalid YouTube URL');
                }
              }
            };

            return (
              <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 p-6">
                <div className="max-w-2xl mx-auto">
                  <button
                    onClick={() => setView('home')}
                    className="mb-6 text-indigo-600 hover:text-indigo-800 font-semibold"
                  >
                    ← Back to Home
                  </button>

                  <h2 className="text-3xl font-bold text-gray-800 mb-6">Add Content</h2>

                  <div className="flex gap-2 mb-6">
                    <button
                      onClick={() => setContentType('book')}
                      className={`flex-1 py-3 px-4 rounded-lg font-semibold transition-all ${
                        contentType === 'book'
                          ? 'bg-indigo-600 text-white shadow-md'
                          : 'bg-white text-gray-600 hover:bg-gray-50'
                      }`}
                    >
                      <BookOpen className="inline mr-2" size={20} />
                      Book
                    </button>
                    <button
                      onClick={() => setContentType('youtube')}
                      className={`flex-1 py-3 px-4 rounded-lg font-semibold transition-all ${
                        contentType === 'youtube'
                          ? 'bg-red-600 text-white shadow-md'
                          : 'bg-white text-gray-600 hover:bg-gray-50'
                      }`}
                    >
                      <Youtube className="inline mr-2" size={20} />
                      YouTube
                    </button>
                  </div>

                  {contentType === 'book' && (
                    <div className="bg-white rounded-xl p-6 shadow-sm space-y-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          Book Title
                        </label>
                        <input
                          type="text"
                          value={bookTitle}
                          onChange={(e) => setBookTitle(e.target.value)}
                          placeholder="The Defining Decade"
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        />
                      </div>
                      
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          Current Chapter / Section
                        </label>
                        <input
                          type="text"
                          value={bookChapter}
                          onChange={(e) => setBookChapter(e.target.value)}
                          placeholder="Chapter 3: The Unthought Known"
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        />
                      </div>

                      <button
                        onClick={handleAddBook}
                        className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-all"
                      >
                        Add Book
                      </button>
                    </div>
                  )}

                  {contentType === 'youtube' && (
                    <div className="bg-white rounded-xl p-6 shadow-sm space-y-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          YouTube Video URL
                        </label>
                        <input
                          type="text"
                          value={youtubeUrl}
                          onChange={(e) => setYoutubeUrl(e.target.value)}
                          placeholder="https://youtube.com/watch?v=..."
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                        />
                      </div>

                      <button
                        onClick={handleAddYouTube}
                        className="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition-all"
                      >
                        Add Video
                      </button>

                      <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                        <p className="text-sm text-blue-800">
                          <strong>Pro tip:</strong> For the MVP, paste the URL of educational videos you just watched. 
                          Later we'll auto-sync your YouTube watch history!
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          // Quiz View
          const QuizView = () => {
            if (!currentQuiz) return null;

            const currentQ = currentQuiz.questions[currentQuiz.currentQuestion];
            const progress = ((currentQuiz.currentQuestion + 1) / currentQuiz.questions.length) * 100;

            if (currentQuiz.completed) {
              return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 p-6 flex items-center justify-center">
                  <div className="max-w-md w-full bg-white rounded-2xl p-8 shadow-xl">
                    <div className="text-center mb-6">
                      <div className="inline-block p-4 bg-green-100 rounded-full mb-4">
                        <Trophy className="text-green-600" size={48} />
                      </div>
                      <h2 className="text-3xl font-bold text-gray-800 mb-2">Quiz Complete!</h2>
                      <p className="text-gray-600">{currentQuiz.title}</p>
                    </div>

                    <div className="space-y-4 mb-6">
                      <div className="flex justify-between items-center p-4 bg-gray-50 rounded-lg">
                        <span className="text-gray-700 font-semibold">Score</span>
                        <span className="text-2xl font-bold text-indigo-600">
                          {currentQuiz.percentCorrect}%
                        </span>
                      </div>
                      
                      <div className="flex justify-between items-center p-4 bg-gray-50 rounded-lg">
                        <span className="text-gray-700 font-semibold">Correct Answers</span>
                        <span className="text-xl font-bold text-gray-800">
                          {currentQuiz.correctAnswers} / {currentQuiz.questions.length}
                        </span>
                      </div>
                      
                      <div className="flex justify-between items-center p-4 bg-yellow-50 rounded-lg">
                        <span className="text-gray-700 font-semibold">Points Earned</span>
                        <span className="text-xl font-bold text-yellow-600">
                          +{currentQuiz.pointsEarned}
                        </span>
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        setCurrentQuiz(null);
                        setView('home');
                      }}
                      className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-all"
                    >
                      Back to Home
                    </button>
                  </div>
                </div>
              );
            }

            return (
              <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 p-6">
                <div className="max-w-2xl mx-auto">
                  <div className="mb-6">
                    <div className="flex justify-between text-sm text-gray-600 mb-2">
                      <span>Question {currentQuiz.currentQuestion + 1} of {currentQuiz.questions.length}</span>
                      <span>{Math.round(progress)}% Complete</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2">
                      <div
                        className="bg-indigo-600 h-2 rounded-full transition-all duration-300"
                        style={{ width: `${progress}%` }}
                      />
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-8 shadow-lg mb-6">
                    <p className="text-sm text-indigo-600 font-semibold mb-2">
                      {currentQuiz.type === 'book' ? '📚 Book' : '🎥 Video'}: {currentQuiz.title}
                    </p>
                    <h3 className="text-2xl font-bold text-gray-800 mb-6">
                      {currentQ.question}
                    </h3>

                    <div className="space-y-3">
                      {currentQ.options.map((option, index) => (
                        <button
                          key={index}
                          onClick={() => submitAnswer(index)}
                          className="w-full text-left p-4 border-2 border-gray-200 rounded-xl hover:border-indigo-600 hover:bg-indigo-50 transition-all font-medium text-gray-700"
                        >
                          <span className="inline-block w-8 h-8 bg-gray-100 rounded-full text-center leading-8 mr-3 font-semibold">
                            {String.fromCharCode(65 + index)}
                          </span>
                          {option}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="text-center text-gray-600">
                    <Flame className="inline text-orange-500 mr-2" size={20} />
                    <span className="font-semibold">{streak} day streak</span> - Keep it going!
                  </div>
                </div>
              </div>
            );
          };

          // Stats View
          const StatsView = () => (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-50 p-6">
              <div className="max-w-2xl mx-auto">
                <button
                  onClick={() => setView('home')}
                  className="mb-6 text-indigo-600 hover:text-indigo-800 font-semibold"
                >
                  ← Back to Home
                </button>

                <h2 className="text-3xl font-bold text-gray-800 mb-6">Your Progress</h2>

                <div className="grid grid-cols-2 gap-4 mb-6">
                  <div className="bg-white rounded-xl p-6 shadow-sm">
                    <p className="text-sm text-gray-600 mb-1">Average Score</p>
                    <p className="text-3xl font-bold text-indigo-600">
                      {quizHistory.length > 0
                        ? Math.round(quizHistory.reduce((acc, q) => acc + q.score, 0) / quizHistory.length)
                        : 0}%
                    </p>
                  </div>
                  
                  <div className="bg-white rounded-xl p-6 shadow-sm">
                    <p className="text-sm text-gray-600 mb-1">Best Streak</p>
                    <p className="text-3xl font-bold text-orange-500">{streak} days</p>
                  </div>
                </div>

                <div className="bg-white rounded-xl p-6 shadow-sm">
                  <h3 className="text-xl font-bold text-gray-800 mb-4">Recent Quizzes</h3>
                  
                  {quizHistory.length === 0 ? (
                    <p className="text-gray-600 text-center py-8">
                      No quizzes yet. Start your first one!
                    </p>
                  ) : (
                    <div className="space-y-3">
                      {quizHistory.map((quiz, index) => (
                        <div
                          key={index}
                          className="flex items-center justify-between p-4 bg-gray-50 rounded-lg"
                        >
                          <div>
                            <p className="font-semibold text-gray-800">{quiz.title}</p>
                            <p className="text-sm text-gray-600">{quiz.date}</p>
                          </div>
                          <div className="text-right">
                            <p className="text-2xl font-bold text-indigo-600">{quiz.score}%</p>
                            <p className="text-sm text-gray-600">
                              {quiz.correct}/{quiz.total}
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );

          return (
            <>
              {view === 'home' && <HomeView />}
              {view === 'addContent' && <AddContentView />}
              {view === 'quiz' && <QuizView />}
              {view === 'stats' && <StatsView />}
            </>
          );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RetentionApp />);
    </script>
</body>
</html>
